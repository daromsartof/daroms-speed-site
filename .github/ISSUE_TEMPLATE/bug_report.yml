name: Bug report
description: Something in the CLI, a core package, the template or the AI layer does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: '`cat core/VERSION` in a site, or the npm version.'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - 'CLI'
        - 'Site template'
        - 'Core package'
        - 'Registry section'
        - 'Module'
        - 'AI layer (skills, hooks)'
        - 'AimKit'
        - 'Deploy'
        - 'Docs'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands run, with their output. Remove secrets and personal data.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node.js and pnpm versions, deploy target.
