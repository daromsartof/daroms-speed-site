# Builds the docs site (website/, Starlight, content from docs/) and publishes it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'CATALOG.md'
      - 'cli/lib/docs.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No dependency cache: this job produces what Pages serves.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dss/website build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
