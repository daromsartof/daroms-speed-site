# Production deploy to Cloudflare on every push to main, once enabled:
# repository variable DSS_DEPLOY=cloudflare, secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cloudflare:
    if: ${{ vars.DSS_DEPLOY == 'cloudflare' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No dependency cache in a job holding deploy secrets: a pull request could poison it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm dss doctor --quick --strict
      - run: pnpm cf:deploy
        env:
          DSS_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
