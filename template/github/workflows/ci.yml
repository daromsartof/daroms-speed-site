# Checks every push and pull request: doctor, lint, types, production build.
# core/ is a git submodule: a private core repository needs a token with read access (actions/checkout `token`).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dss doctor --quick
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
